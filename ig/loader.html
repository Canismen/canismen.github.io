<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Chargeur de visuels</title>
<style>body{font:15px/1.5 system-ui;padding:24px;color:#222}p{margin:4px 0}</style></head>
<body><h1 style="font-size:18px">Transfert des visuels vers la fenêtre Instagram</h1>
<script>
(async () => {
  const log = m => document.body.insertAdjacentHTML('beforeend', '<p>' + m + '</p>');
  const q = new URLSearchParams(location.search);
  const list = (q.get('files') || '').split(',').filter(Boolean);
  const target = window.opener;
  if (!target) { log('Aucune fenêtre parente : ouvrir cette page depuis Instagram.'); return; }
  if (!list.length) { log('Aucun fichier demandé.'); return; }
  for (const n of list) {
    try {
      const r = await fetch('/ig/' + n + '.jpg', {cache: 'no-store'});
      if (!r.ok) { log(n + ' : erreur ' + r.status); continue; }
      const buf = await r.arrayBuffer();
      target.postMessage({igfile: true, name: n + '.jpg', buf: buf}, 'https://www.instagram.com', [buf]);
      log(n + ' envoyé');
    } catch (e) { log(n + ' : ' + e); }
  }
  target.postMessage({igdone: true}, 'https://www.instagram.com');
  log('Terminé. Vous pouvez fermer cet onglet.');
})();
</script></body></html>
